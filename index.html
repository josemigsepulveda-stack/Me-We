<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Me&amp;We — Mieux se comprendre, mieux vivre ensemble</title>
<style>
:root{--c1:#0C8FE0;--c2:#5BBD3E;--bg:#F4F8FB;--card:#fff;--tx:#1a2a3a;--mu:#7B8D9E;--bd:#dce6ef;--grad:linear-gradient(135deg,#0C8FE0,#1BA87E,#5BBD3E)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input{font-family:inherit}
.page{min-height:100vh;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:16px;padding:1.3rem;box-shadow:0 1px 10px rgba(0,60,120,.06);margin-bottom:.8rem}
.btn-p{padding:13px 24px;border-radius:12px;border:none;background:var(--grad);color:#fff;font-size:.93rem;font-weight:600;width:100%;cursor:pointer}
.btn-p:hover{opacity:.9}
.btn-o{padding:13px 24px;border-radius:12px;border:2px solid var(--c1);background:transparent;color:var(--c1);font-size:.93rem;font-weight:600;cursor:pointer}
.pill{display:inline-block;padding:4px 12px;border-radius:20px;font-size:.74rem;font-weight:600}
.hdr{background:#fff;border-bottom:1px solid var(--bd);padding:11px 18px;position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between}
.hdr-b{background:none;border:none;font-size:1.15rem;color:var(--c1);padding:0;margin-right:8px;cursor:pointer}
.tile{background:#fff;border-radius:16px;padding:1.05rem 1.15rem;box-shadow:0 1px 10px rgba(0,60,120,.06);width:100%;border:none;text-align:left;display:flex;gap:13px;align-items:center;margin-bottom:.65rem;transition:transform .15s,box-shadow .15s;cursor:pointer}
.tile:hover{transform:translateY(-2px);box-shadow:0 4px 18px rgba(0,60,120,.1)}
.tile-i{width:50px;height:50px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0}
.ob{background:#fff;border:2px solid var(--bd);padding:14px 16px;border-radius:12px;font-size:.87rem;line-height:1.5;text-align:left;width:100%;margin-bottom:7px;transition:all .15s;display:flex;align-items:flex-start;gap:9px;cursor:pointer}
.ob:hover{border-color:var(--c1);background:#f0f8ff}
.ob.sel{background:var(--grad);color:#fff;border-color:var(--c1)}
.ol{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-size:.77rem;font-weight:700;background:#E3F2FD;color:var(--c1);flex-shrink:0}
.ob.sel .ol{background:rgba(255,255,255,.25);color:#fff}
.db{margin:9px 0}.dbl{display:flex;justify-content:space-between;font-size:.75rem;margin-bottom:3px}
.dbt{display:flex;height:7px;border-radius:7px;overflow:hidden;background:#ecf0f4}
.dbf{transition:width .5s;border-radius:7px}
.pt{margin:10px 0;background:#E3F2FD;border-radius:10px;height:5px;overflow:hidden}
.pf{height:100%;background:var(--grad);border-radius:10px;transition:width .4s}
.dots{display:flex;justify-content:center;gap:3px;flex-wrap:wrap;padding:1.3rem 0}
.dot{border-radius:50%;cursor:pointer;transition:all .2s;border:none}
.mx{max-width:540px;margin:0 auto;padding:0 16px}
.cb{display:inline-block;padding:5px 12px;border-radius:20px;font-size:.75rem;font-weight:600;border:none;cursor:pointer;margin:0 3px 5px 0}
.sc{border-left:3px solid;padding-left:11px;margin-bottom:7px;font-size:.82rem;color:#555;line-height:1.55}
input[type=text],input[type=email],input[type=password]{width:100%;padding:10px 14px;border-radius:10px;border:1.5px solid var(--bd);font-size:.91rem;margin-bottom:.7rem;box-sizing:border-box;background:#fff}
input:focus{outline:none;border-color:var(--c1)}
.tg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:.7rem}
.tb{padding:7px 2px;border-radius:9px;border:1.5px solid var(--bd);background:#fff;text-align:center;font-size:.66rem;cursor:pointer}
.profile-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:.8rem}
.profile-card{background:#fff;border-radius:13px;padding:.9rem;border:1.5px solid var(--bd);cursor:pointer;text-align:center;transition:all .15s}
.profile-card:hover{border-color:var(--c1);transform:translateY(-2px);box-shadow:0 3px 14px rgba(0,60,120,.08)}
.hist-row{display:flex;align-items:center;gap:9px;padding:9px 13px;border-radius:11px;background:#fff;margin-bottom:5px;border:1px solid var(--bd)}
.auth-card{background:#fff;border-radius:18px;padding:2rem;box-shadow:0 4px 24px rgba(0,60,120,.1);max-width:400px;margin:0 auto}
.detail-section{margin-bottom:1rem}
.detail-section h4{font-size:1rem;font-weight:700;margin:1.2rem 0 .7rem;padding-bottom:.4rem;border-bottom:2px solid #e8f0f8}
.detail-section ul{list-style:none;padding:0;margin:0}
.detail-section li{font-size:.82rem;color:#555;line-height:1.55;padding:5px 0 5px 13px;border-left:2px solid;margin-bottom:2px}
.detail-section p{font-size:.84rem;color:#555;line-height:1.65;margin:0}
.logo-header{display:flex;align-items:center;justify-content:center;gap:8px}
.logo-header img{height:36px}
.logo-big{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:.5rem}
.logo-big img{height:56px}
</style>
</head>

const PD={"ISTJ": {"kersey": "L'inspecteur", "avatar": "Castor", "animalTotem": "Le castor est un animal très travailleur et méticuleux. Pendant que les autres animaux s'amusent, il préfère consacrer son temps à bâtir et à s'occuper de sa maison. Il est organisé et structuré. Il ne laisse rien au hasard et il cherche à se préparer à toute éventualité. Dôté d'un esprit pratique, il est capable d'agir et de modifier son environnement pour s'assurer stabilité et sécurité. Il se montre volontaire et fait preuve de discipline pour aller au bout de ce qu'il entreprend. Il a beauco…", "temperament": "Les gardiens", "famille": "L'Inspecteur fait partie de la famille des gardiens :  \n\nTous les gardiens ont des caractéristiques communes :\n• Aiment se sentir utiles, sont fiables et travailleurs.\n• Sont des personnes loyales, responsables et apportent une certaine stabilité à leur entourage.\n• Sont humbles, consciencieux, prudents, respectueux des traditions et font confiance aux expériences / règles de conduite qui ont fait leurs preuves.\n• Recherchent la sécurité, aiment bien contrôler et prévoir les choses à l’avance, v", "caracPrincipales": "Sont méticuleux, attentifs aux détails, exigeants et font preuve d'un esprit critique. Veillent au respect des horaires et à la bonne tenue des échéances. Souhaiteraient que tout le monde soit aussi fiable. Se montrent appliqués dans leur travail et s'attachent à respecter les procédures et les règles établies. Apprécient quand les personnes savent ce qu'elles doivent faire et lorsque chacun est au clair sur son rôle et ses responsabilités. Sont dévoués et assument leurs responsabilités sans le crier sur tous les toits. Sont discrets et apprécient d'être reconnus au travers de leurs actions et…", "celebrites": ["Richard Nixon - Président américain", "Elisabeth II -  Reine d'angleterre", "Evander Holyfield - Boxeur américain", "Warren Buffet - Homme d'affaires américain", "Harry Truman - Président américain", "Natalie Portman - Actrice", "Matt Damon - Acteur", "Evander Holyfield - Boxeur"], "fiction": ["Elsa - La reine des neiges Disney", "Ned Stark - Game of Thrones", "Monsieur Spock - Star trek", "Hermione - Harry Potter", "Vision - Avengers", "Rey - Star Wars", "Skinner - Les Simpsons", "Windu - Star Wars"], "metiersPlus": ["Contrôleur pollution", "Officier de police", "Ouvrier métallurgiste", "Manager", "Gardien de prison", "Expert-comptable", "Chauffeur scolaire", "Employé de banque"], "metiersMoins": ["Marketing", "Direction générale", "Planificateur RH", "Conseil management", "Comédien", "Photographe", "Travailleur social", "Responsable des ventes"], "traits": ["Reservé(e)", "Réflechi(e)", "Concret(e)", "Pragmatique", "Logique(e)", "Objectif", "Organisé(e)", "Structuré(e)"], "aime": ["Sont observateurs/trices, prudent(e)s et gardent une certaine distance lorsqu'ils ne connaissent pas leurs interlocuteurs", "Prennent le temps de la réflexion, pèsent le pour et le contre avant d'agir ou de parler", "Font confiance à ce qui a fait ses preuves, sont capables de se rappeler d'événements ou d'expériences passées qui peuvent être utile pour régler un problème", "Font preuve de bon sens, ont les pieds sur terre, sont dôtés d'un esprit pratique", "S'appuient sur un raisonnement logique et se montrent factuels pour prendre des décisions", "Ne prennent pas les critiques de manière personnelle", "Prennent des risques mesurés, sont méticuleux/euses, aiment bien maîtriser leur environnement et ont besoin de bien verrouiller les choses pour ne rien laisser au hasard", "Se montrent respectueux/euses des règles, du cadre et des conventions, sont les \"gardiens du temple\" des traditions et des us et coutumes"], "aimeMoins": ["Peuvent sembler froid(e)s et peu abordables", "Donnent l'impression parfois de manquer de réactivité et rebond, sont trop discret(e)s ou prudent(e)s dans leur prise de décision ou dans leur prise de parole", "Ont dans certains cas du mal à aller à l'essentiel, peuvent se perdre dans les détails et ne voir que le \"petit bout de la lorgnette\"", "Ne sortent pas toujours des sentiers battus, ont tendance à reprendre \"les mêmes recettes\" sans forcément voir si de nouvelles approches pourraient être plus pertinentes", "Ne tiennent pas assez compte des réactions émotionnelles ou des sentiments des autres dans leurs décisions", "Peuvent avoir du mal à gérer les imprévus, les changements de planning, le flou et l'incertitude", "Sont parfois trop encré(e)s dans la réalité immédiate, il leur est plus difficile de sortir du quotidien et de se projeter sur des possibilités futures et d'imaginer ce qui pourrait être", "Sont moins confortables avec la prise de risque, la nouveauté, le changement, et ont du mal à \"lâcher prise\""], "apprecie": ["Aiment les gens discrets, réfléchis, posés, qui savent de quoi ils parlent et qui sont factuels", "Apprécient les personnes qui écoutent et qui suivent leurs conseils, qui respectent l'autorité et qui suivent les consignes", "Préfèrent les personnes qui savent se concentrer sur leurs objectifs, qui disent clairement ce qu'elles font et qui font ce qu'elles disent", "Sont sensibles aux personnes qui font preuve d'un sens pratique et qui font leur travail / ce qu'il y a à faire sans le crier sur tous les toits", "Sont plus enclin(e)s à prendre en compte des arguments factuels, logiques et qui s'appuient sur des exemples concrets ou des expériences vécues", "Valorisent la rigueur, l'organisation, la discipline et le sens des responsabilités", "Apprécient les personnes qui sont constantes, cordiales sans pour autant être trop familières et qui savent garder une certaine distance", "Aiment les personnes qui font preuve d'un esprit de compétition et qui sont capables d'aller de l'avant malgré les difficultés"], "irrite": ["Sont facilement irrité(e)s par des personnes qui \"brassent de l'air\" et qui ont tendance à plus parler, à plus se mettre en avant que ce qu'elles ont réellement fait / réalisé", "N'aiment pas trop les personnes qui présentent des idées \"fumeuses\", vagues, imprécises et qui ne sont pas réalistes", "Ont plus de mal à tolérer les gens qui se montrent peu respectueux des règles, de l'autorité et des traditions", "Apprécient peu les personnes qui attendent toujours la dernière minute pour rendre un travail, qui sont \"brouillons\", qui manquent de rigueur et qui ne sont pas ponctuels", "Supportent difficilement les attaques ou les critiques personnelles à leur attention", "Ont un goût modéré pour les gens qui font la promotion du changement / de la nouveauté sans avoir vérifié si ces changements étaient opportuns ou sans avoir pris en compte les expériences passées", "Ne sont pas rassuré(e)s par les personnes qui ne prennent pas le temps de vérifier ou de recueillir toutes les informations avant de prendre des décisions", "Sont moins à l'aise avec les gens qui sont trop théoriques ou idéalistes et qui ne prennent pas suffisamment en compte la réalité et les besoins immédiats"]}, "ISFJ": {"kersey": "Le protecteur", "avatar": "Cerf", "animalTotem": "Le cerf est un animal plutôt reservé. Il aime bien avoir son territoire et ne va que très occasionnellement dans celui des autres. Il ne cherche pas à gêner, blesser, déranger les autres animaux ni même leur voler leur nourriture. Son objectif principal c’est de vivre en harmonie avec la nature et les autres animaux. Respectueux du territoire des autres, il sait protéger le sien et sa famille en donnant un coup foudroyant avec ses bois ou avec ses sabots s’il sent une menace.", "temperament": "Les gardiens", "famille": "Le Protecteur fait partie de la famille des gardiens :  \n\nTous les gardiens ont des caractéristiques communes :\n• Aiment se sentir utiles, sont fiables et travailleurs.\n• Sont des personnes loyales, responsables et apportent une certaine stabilité à leur entourage.\n• Sont humbles, consciencieux, prudents, respectueux des traditions et font confiance aux expériences / règles de conduite qui ont fait leurs preuves.\n• Recherchent la sécurité, aiment bien contrôler et prévoir les choses à l’avance, ", "caracPrincipales": "Prennent très sérieux leurs devoirs et leurs responsabilités. Apprécient d'être considérées comme des personnes fiables et dignes de confiance. Croient aussi en la loi et l'ordre, et regrettent parfois que le respect de l'autorité et de l’ordre, des valeurs morales et des traditions se perde. Dans un monde moderne mouvant et changeant, contribuent à apporter une stabilité et à préserver ce qui fonctionne bien et les héritages du passé. Dotés d’un esprit pratique, ont les pieds sur terre, sont méticuleux et respectueux des horaires et des règles. Se méfient du changement et préfèrent l’aborder …", "celebrites": ["Rosa Parks - Activiste du Mouvement des droits civiques américains", "Mère Térésa - Nonne catholique", "Michael Caine - Acteur", "Louisa May Alcott - Ecrivain américain", "Queen Mary I - Reine d'Angleterre", "Kanye West - Rappeur et producteur", "Catherine - Duchesse de Cambridge", "Tiger Woods - Golfeur"], "fiction": ["Cendrillon (Walt Disney)", "Capitaine América (Avengers)", "Pâquerette (La belle au bois dormant)", "6PO (Star Wars)", "Catelyn Stark (Game of thrones)", "Marge Simpson (Les Simpsons)", "Bella (Twillight)", "Leonard Mc Coy (Star trek)"], "metiersPlus": ["Clergé et religieux", "Infirmier", "Chef de bureau", "Enseignant primaire et secondaire", "Ostéopathe", "Chauffeur scolaire", "Enseignant maternelle", "Admin. Service social"], "metiersMoins": ["Assistant dentiste", "Artiste", "Conseiller", "Religieux", "Musicien, compositeur", "Psychologue", "Instituteur maternelle", "Relations publiques"], "traits": ["Reservé(e)", "Réflechi(e)", "Concret(e)", "Pragmatique", "Bienveillant(e)", "Convaincant(e)", "Organisé(e)", "Structuré(e)"], "aime": ["Sont discret(e)s et reservé(e)s, préfèrent écouter et observer quand ils ne connaissent pas les gens ou lorsqu'ils sont dans des événements mondains", "Sont amicaux, adoptent une approc function calc(ans,qs){var s={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};ans.forEach(function(a,i){if(a!==null&&qs[i])s[qs[i].o[a].a]++});var t=(s.E>=s.I?"E":"I")+(s.S>=s.N?"S":"N")+(s.T>=s.F?"T":"F")+(s.J>=s.P?"J":"P");function pf(a,b){var x=s[a]+s[b];return x===0?50:Math.round(s[a]/x*100)}return{type:t,pct:{E:pf("E","I"),I:pf("I","E"),S:pf("S","N"),N:pf("N","S"),T:pf("T","F"),F:pf("F","T"),J:pf("J","P"),P:pf("P","J")}}}

function compat(a,b){var al=[],co=[],fr=[];var sh=0;var px=[["E","I",0,"énergie"],["S","N",1,"perception"],["T","F",2,"décision"],["J","P",3,"mode de vie"]];px.forEach(function(p){if(a[p[2]]===b[p[2]]){sh++;al.push("Même préférence en "+p[3]+" ("+a[p[2]]+")")}else{co.push("Complémentarité en "+p[3]);fr.push("Tension possible en "+p[3])}});return{al:al,co:co,fr:fr,sc:Math.min(Math.round(sh/4*55+co.length/3*45+15),95),sh:sh}}

function radarSVG(pct,color){var sz=240,cx=sz/2,cy=sz/2,r=sz/2-30,dims=["E","S","T","J","I","N","F","P"],n=8;var svg='<svg viewBox="0 0 '+sz+' '+sz+'" style="max-width:250px;margin:0 auto;display:block">';for(var lv=1;lv<=4;lv++){var pts=[];for(var i=0;i<n;i++){var a=Math.PI*2*i/n-Math.PI/2,rr=r*lv/4;pts.push((cx+rr*Math.cos(a)).toFixed(1)+","+(cy+rr*Math.sin(a)).toFixed(1))}svg+='<polygon points="'+pts.join(" ")+'" fill="none" stroke="#dce6ef" stroke-width="0.5"/>';}for(var i=0;i<n;i++){var a=Math.PI*2*i/n-Math.PI/2;svg+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+r*Math.cos(a)).toFixed(1)+'" y2="'+(cy+r*Math.sin(a)).toFixed(1)+'" stroke="#dce6ef" stroke-width="0.5"/>';}var pts2=[];for(var i=0;i<n;i++){var a=Math.PI*2*i/n-Math.PI/2,v=pct[dims[i]]/100*r;pts2.push((cx+v*Math.cos(a)).toFixed(1)+","+(cy+v*Math.sin(a)).toFixed(1))}svg+='<polygon points="'+pts2.join(" ")+'" fill="'+color+'" fill-opacity="0.2" stroke="'+color+'" stroke-width="2"/>';for(var i=0;i<n;i++){var a=Math.PI*2*i/n-Math.PI/2,lr=r+18,x=(cx+lr*Math.cos(a)).toFixed(1),y=(cy+lr*Math.sin(a)).toFixed(1);svg+='<text x="'+x+'" y="'+y+'" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#7B8D9E" font-weight="'+(pct[dims[i]]>=50?700:400)+'">'+dims[i]+'</text>'}svg+='</svg>';return svg}

    },

    },

function genCross(t1, t2) {
  var p1 = PD[t1], p2 = PD[t2];
  var a1 = p1.avatar, a2 = p2.avatar;
  var artA1 = artName(a1), artA2 = artName(a2);
  var shared = [], diff = [];
  
  for (var d = 0; d < 4; d++) {
    if (t1[d] === t2[d]) {
      shared.push({letter: t1[d], dim: CROSS_DATA.dims[d]});
    } else {
      diff.push({l1: t1[d], l2: t2[d], dim: CROSS_DATA.dims[d]});
    }
  }
  
  var sc = Math.min(Math.round(shared.length/4*55 + diff.length/3*45 + 15), 95);
  
  // Characteristics
  var chars1 = [], chars2 = [];
  for (var i = 0; i < 4; i++) { chars1.push(CROSS_DATA.chars[t1[i]][i]); chars2.push(CROSS_DATA.chars[t2[i]][i]); }
  
  // Forces & vigilance
  var forces1 = [], forces2 = [], vig1 = [], vig2 = [];
  for (var i = 0; i < 4; i++) {
    forces1.push(CROSS_DATA.forces[t1[i]][0]); forces2.push(CROSS_DATA.forces[t2[i]][0]);
    vig1.push(CROSS_DATA.vigil[t1[i]][0]); vig2.push(CROSS_DATA.vigil[t2[i]][0]);
  }
  
  // Values & needs
  var val1 = [], val2 = [], need1 = [], need2 = [];
  for (var i = 0; i < 4; i++) {
    val1.push(CROSS_DATA.values[t1[i]]); val2.push(CROSS_DATA.values[t2[i]]);
    need1.push(CROSS_DATA.needs[t1[i]]); need2.push(CROSS_DATA.needs[t2[i]]);
  }
  
  // Alignments
  var align = [];
  for (var i = 0; i < shared.length; i++) {
    var s = shared[i];
    var full = s.letter === s.dim.pair[0] ? s.dim.fullA : s.dim.fullB;
    align.push({
      domain: s.dim.label.charAt(0).toUpperCase() + s.dim.label.slice(1),
      a: "Même préférence en " + s.dim.label + " (" + full + ")",
      b: a1 + " et " + a2 + " partagent une approche similaire, ce qui facilite la compréhension mutuelle"
    });
  }
  
  // Complementarities
  var compl = [];
  for (var i = 0; i < diff.length; i++) {
    var df = diff[i];
    var pairKey = df.dim.pair[0] + df.dim.pair[1];
    var tpl = CROSS_DATA.compTpl[pairKey];
    if (tpl) {
      var lines = [];
      for (var j = 0; j < tpl.length; j++) {
        var line = tpl[j];
        // Replace placeholders
        line = line.replace(/\{a1\}/g, a1).replace(/\{a2\}/g, a2);
        line = line.replace(/\{dA\}/g, df.dim.fullA).replace(/\{dB\}/g, df.dim.fullB);
        // For SN/TF/JP specific replacements
        if (pairKey === 'SN') {
          line = line.replace(/\{aS\}/g, df.l1==='S'?a1:a2).replace(/\{aN\}/g, df.l1==='N'?a1:a2);
        } else if (pairKey === 'TF') {
          line = line.replace(/\{aT\}/g, df.l1==='T'?a1:a2).replace(/\{aF\}/g, df.l1==='F'?a1:a2);
        } else if (pairKey === 'JP') {
          line = line.replace(/\{aJ\}/g, df.l1==='J'?a1:a2).replace(/\{aP\}/g, df.l1==='P'?a1:a2);
        } else if (pairKey === 'EI') {
          line = line.replace(/\{aE\}/g, df.l1==='E'?a1:a2).replace(/\{aI\}/g, df.l1==='I'?a1:a2);
        }
        lines.push(line);
      }
      compl.push({title: df.dim.fullA + " vs " + df.dim.fullB, lines: lines});
    }
  }
  
  // Frictions
  var frict = [];
  for (var i = 0; i < diff.length; i++) {
    var df = diff[i];
    var pairKey = df.dim.pair[0] + df.dim.pair[1];
    var tpl = CROSS_DATA.frictTpl[pairKey];
    if (tpl) {
      var risk = tpl.risk, action = tpl.action;
      // Replace all placeholders
      var replacements = {'{a1}':a1,'{a2}':a2};
      if (pairKey==='EI') { replacements['{aE}']=df.l1==='E'?a1:a2; replacements['{aI}']=df.l1==='I'?a1:a2; }
      if (pairKey==='SN') { replacements['{aS}']=df.l1==='S'?a1:a2; replacements['{aN}']=df.l1==='N'?a1:a2; }
      if (pairKey==='TF') { replacements['{aT}']=df.l1==='T'?a1:a2; replacements['{aF}']=df.l1==='F'?a1:a2; }
      if (pairKey==='JP') { replacements['{aJ}']=df.l1==='J'?a1:a2; replacements['{aP}']=df.l1==='P'?a1:a2; }
      for (var k in replacements) { risk = risk.split(k).join(replacements[k]); action = action.split(k).join(replacements[k]); }
      frict.push({domain: tpl.domain, risk: risk, action: action});
    }
  }
  
  // Guide
  var guide = [
    {title:"Routines et priorités", text:"Quelles sont les priorités de chacun cette semaine ? Quels projets nécessitent planification stricte et quels projets peuvent être flexibles ?"},
    {title:"Échanges émotionnels", text: a1 + " : partager ce qui " + (t1[2]==='F'?"enthousiasme ou préoccupe":"est clair et structurant") + ". " + a2 + " : partager ce qui " + (t2[2]==='F'?"enthousiasme ou préoccupe":"rassure et sécurise") + "."},
    {title:"Planification commune", text:"Définir ensemble 1-2 routines fixes (ex : repas, moments de partage). Prévoir 1-2 moments spontanés pour stimuler créativité et légèreté."},
    {title:"Débrief et feedback", text:"Qu'est-ce qui a bien fonctionné ? Qu'est-ce qui pourrait être amélioré ? Quels ajustements pour mieux respecter le rythme et les besoins de chacun ?"}
  ];
  
  // Suggestions
  var sugg1 = [], sugg2 = [];
  for (var i = 0; i < diff.length; i++) {
    var df = diff[i];
    var pairKey = df.dim.pair[0] + df.dim.pair[1];
    if (pairKey==='EI') {
      if (df.l1==='E') { sugg1.push("Noter ses idées pour ne pas submerger " + artName(a2)); sugg2.push("Communiquer clairement ses besoins de calme " + artAu(a1)); }
      else { sugg1.push("Faire l'effort de partager davantage ses réflexions avec " + artName(a2)); sugg2.push("Laisser du temps de réflexion " + artAu(a1) + " avant d'attendre une réponse"); }
    }
    if (pairKey==='SN') {
      if (df.l1==='S') { sugg1.push("Apprécier la créativité " + artDe(a2) + " même si elle semble abstraite"); sugg2.push("Ancrer ses idées dans des exemples concrets pour " + artName(a1)); }
      else { sugg1.push("Préciser ses idées avec des exemples concrets pour " + artName(a2)); sugg2.push("S'ouvrir aux nouvelles perspectives " + artDe(a1)); }
    }
    if (pairKey==='TF') {
      if (df.l1==='T') { sugg1.push("Prendre en compte les sentiments " + artDe(a2) + " dans les échanges"); sugg2.push("Accepter l'analyse logique " + artDe(a1) + " sans la prendre personnellement"); }
      else { sugg1.push("Accepter l'approche analytique " + artDe(a2) + " comme complémentaire"); sugg2.push("Reconnaître et valoriser la sensibilité " + artDe(a1)); }
    }
    if (pairKey==='JP') {
      if (df.l1==='J') { sugg1.push("Accepter ponctuellement la spontanéité " + artDe(a2)); sugg2.push("Respecter le besoin de planification " + artDe(a1)); }
      else { sugg1.push("Préciser ses priorités et échéances pour rassurer " + artName(a2)); sugg2.push("Laisser de l'espace pour l'improvisation " + artDe(a1)); }
    }
  }
  sugg1.push("Apprécier et respecter la constance et la méthode " + artDe(a2));
  sugg2.push("Écouter les idées " + artDe(a1) + " avant de juger ou critiquer");
  
  return {
    sc:sc, sh:shared.length, co:diff.length,
    chars1:chars1, chars2:chars2,
    forces1:forces1, forces2:forces2,
    vig1:vig1, vig2:vig2,
    val1:val1.join(", "), val2:val2.join(", "),
    need1:need1.join(", "), need2:need2.join(", "),
    align:align, compl:compl, frict:frict,
    guide:guide, sugg1:sugg1, sugg2:sugg2
  };
}

function pickA(idx,mode,len){var a=S.qa.slice();a[S.qc]=idx;go({qa:a,qc:S.qc<len-1?S.qc+1:S.qc})}
function finishQ(mode){
  var ans=S.qa;var unanswered=ans.filter(function(a){return a===null}).length;
  if(mode==="self"){
    if(unanswered>6){alert("Il reste "+unanswered+" questions sans réponse.");return}
    var r=calc(ans,QS);var d=new Date();var ds=d.toLocaleDateString("fr-FR")+" "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
    S.user.history=S.user.history||[];S.user.history.push({type:r.type,date:ds});
    S.user.myType=r.type;S.user.myPct=r.pct;saveUser(S.user);go({page:"selfRes"});
  }else if(mode==="360o"){
    if(unanswered>5){alert("Il reste "+unanswered+" questions.");return}
    var r=calc(ans,Q3);go({page:"360or",tmp:{name:S.tmp.name,circle:S.tmp.circle,rt:r.type,rp:r.pct}});
  }
}

function saveSettings(){
  var fn=document.getElementById("s-fn").value.trim(),ln=document.getElementById("s-ln").value.trim(),em=document.getElementById("s-em").value.trim(),pw=document.getElementById("s-pw").value;
  if(!fn||!ln||!em){alert("Pr\u00e9nom, nom et email requis");return}
  S.user.firstName=fn;S.user.lastName=ln;S.user.email=em;
  if(pw){if(pw.length<6){alert("Mot de passe min 6 caract\u00e8res");return}S.user.password=pw}
  saveUser(S.user);alert("\u2705 Modifications enregistr\u00e9es");render();
}
function deleteAccount(){
  if(!confirm("\u00cates-vous s\u00fbr ? Toutes vos donn\u00e9es seront supprim\u00e9es."))return;
  if(!confirm("Derni\u00e8re confirmation ?"))return;
  var db=getDB();delete db.users[S.user.id];saveDB(db);localStorage.removeItem("mw_uid");S.user=null;go({page:"auth"});
}
